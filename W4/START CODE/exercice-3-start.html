<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: white;
      }

      .container {
        display: flex;
        flex-direction: column;
        margin: 1em;
        gap: 1em;
      }

      header {
        background: #4169e1;
        height: 60px;
        display: flex;
        align-items: center;
        padding-left: 1em;
        color: white;
        border-radius: 6px;
        box-shadow: 0 4px 10px  #0077ea
      }

      footer {
        background: #4169e1;
        height: 60px;
        display: flex;
        align-items: center;
        padding-left: 1em;
        color: white;
        border-radius: 6px;
        box-shadow: 0 4px 10px  #1d44b8
      }

      .content-row {
        display: flex;
        flex-direction: row;
        gap: 1em;
      }

      main {
        background: #3cb371;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        flex-grow: 3;
        gap: 1em;
        padding: 1em;
        box-sizing: border-box;
        min-width: 0;
        border-radius: 8px;
        box-shadow: 0 4px 10px   #2f8d59
      }

      sidebar {
        background: #ff6347;
        flex-grow: 1;
        flex-basis: 15em;
        padding: 1em;
        color: white;
        box-sizing: border-box;
        border-radius: 8px;
        box-shadow: 0 4px 10px #e02200;
      }

      .item {
        background: #2f8d59;
        height: 100px;                 
        flex: 0 0 20%;  
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        border-radius: 6px;
        box-shadow: 0 4px 10px #226741;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>header</header>
      
      <div class="content-row">
        <main> 
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
        </main>
        <sidebar>sidebar</sidebar>
      </div>

      <footer>footer</footer>
    </div>
  </body>
</html>
