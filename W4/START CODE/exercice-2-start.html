<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>

      body{
        margin: 0;
        padding: 0;
        background-color: #F7CFB6;
      }
  
      .main {
        height: 100vh;
        background: #25384B;
        display: flex;
        flex-direction: row;
        padding-left: 3em;
        padding-right: 3em;
        gap: 3em;
      }

      .left-section {
        background: #A3CFCC;
        flex-grow: 2;
        flex-wrap: wrap;
      
      }

      .right-section {
        background: #F7CFB6;
        flex-grow: 1;
        flex-basis: 10em;
        display: flex;
        flex-direction: column;
        padding: 1em;        
        box-sizing: border-box;
        gap: 1em;
      }

      .item {
        background: #86C2DE;
        height: 100px;
        flex-grow: 1;
        flex-shrink: 0;

      }
 
    </style>
  </head>
  <body>
    <div class="main">
      <section class="left-section"></section>
      <section class="right-section">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
      </section>
    </div>
  </body>
</html>
