<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRqqbrWlTPPUUyfjlnAOIkZrKFZrw667sBk4J6Kb6LZrFk7cSUUBjvtWy6S&s=10" rel="stylesheet">
</head>


<body>
    <div class="profile-card">
        
        <div class="profile-img-container">
            <img src="https://thumb.wikimedia.org/wikipedia/en/thumb/0/03/Walter_White_S5B.png/250px-Walter_White_S5B.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" alt="Walter White" class="profile-img">
        </div>

    
        <h1 class="profile-name">Walter White</h1>

    
        <p class="profile-role" style="color: #6366f1; font-weight: 600;">Chemistry Teacher & Entrepreneur</p>

      
        <p class="profile-bio">
            Expert in organic chemistry, synthesis processes, and high-purity industrial production.
        </p>

     
        <div class="profile-stats">
            <div class="stat-item">
                <span class="stat-num">34</span>
                <span class="stat-label">Projects</span>
            </div>
            <div class="stat-item">
                <span class="stat-num">1.2K</span>
                <span class="stat-label">Following</span>
            </div>
            <div class="stat-item">
                <span class="stat-num">4.8K</span>
                <span class="stat-label">Followers</span>
            </div>
        </div>

    
        <button class="profile-btn" onclick="alert('Thank you for connecting!')">Contact Me</button>

    </div>

</body>
</html>
